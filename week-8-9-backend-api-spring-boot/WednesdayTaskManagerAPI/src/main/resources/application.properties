spring.profiles.active=postgres
spring.application.name=WednesdayTaskManagerAPI
server.port=${PORT:8080}

# ---------- Database ----------
# Pattern: ${ENVIRONMENT_VARIABLE:default}
# With nothing set, the app uses an in-memory H2 database, so it runs with zero setup.
# To use PostgreSQL, run with the "postgres" profile (see application-postgres.properties).
spring.datasource.url=${DB_URL:jdbc:h2:mem:taskdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# update = create or adjust tables to match the entities. Fine for learning.
# For production use "validate" (check only) and manage the schema with migrations (Flyway / Liquibase).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Look inside the H2 database at http://localhost:8080/h2-console (development only!)
#   JDBC URL: jdbc:h2:mem:taskdb   User: sa   Password: (empty)
spring.h2.console.enabled=true

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------- Sample data ----------
app.seed-data=${SEED_DATA:true}
