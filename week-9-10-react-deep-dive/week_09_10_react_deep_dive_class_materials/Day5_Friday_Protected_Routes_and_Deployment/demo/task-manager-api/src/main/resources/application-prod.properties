# Activated with:  SPRING_PROFILES_ACTIVE=prod  (or --spring.profiles.active=prod)
# Every secret / environment-specific value comes from an environment variable.

# Database (file-based H2 here; swap for PostgreSQL/MySQL RDS in a real deployment)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/taskdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# The deployed front-end origin(s), e.g. https://tasks.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# REQUIRED: no default in production — the app fails to start if it's missing
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

server.port=${PORT:8080}
