spring.application.name=task-manager-api
server.port=8080

# --- H2 in-memory database (resets on restart) ---
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# --- CORS: comma-separated list of front-end origins allowed to call /api/** ---
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# --- JWT (STAGE B2) ---
# HS256 needs at least 32 bytes. In a real deployment, set the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghijklmnop}
app.jwt.expiration-minutes=60
