spring.application.name=hello-claude
server.port=8080

# --- Claude API ---
# The key comes from the ANTHROPIC_API_KEY environment variable. NEVER paste a real key into this file.
# IntelliJ: Run > Edit Configurations > Environment variables > ANTHROPIC_API_KEY=sk-ant-...
app.ai.api-key=${ANTHROPIC_API_KEY:}
# Haiku 5.5 = fastest and cheapest current model: good for class demos
app.ai.model=claude-haiku-5-5
# Upper limit on the length of Claude's reply (includes any thinking tokens)
app.ai.max-tokens=1024
